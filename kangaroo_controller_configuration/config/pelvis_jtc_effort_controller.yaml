pelvis_jtc_effort_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    open_loop_control: true
    joints:
      - pelvis_1_joint
      - pelvis_2_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      pelvis_1_joint:
        goal: 0.02
      pelvis_2_joint:
        goal: 0.02
    gains:
      pelvis_1_joint: {p: 100.0,  d: 0.0, i: 0.0, i_clamp_min: -5.0, i_clamp_max: 5.0}
      pelvis_2_joint: {p: 100.0,  d: 0.0, i: 0.0, i_clamp_min: -5.0, i_clamp_max: 5.0}
